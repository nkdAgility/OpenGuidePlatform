# This workflow is managed by gh actions-lock.

name: GuideSite Pipeline
on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
      source-path:
        type: string
        default: site
      target:
        type: string
        default: auto
      site-url:
        description: Absolute public URL for the selected site environment
        type: string
        default: ''
      platform-ring:
        description: Release ring for explicit overrides; normal builds honor settings.yaml or the legacy installed pin
        type: string
        default: production
      platform-release:
        description: Optional release override; otherwise use settings.yaml and the generated installation record. Candidate ZIPs are for platform validation.
        default: ''
        type: string
      platform-package-url:
        description: HTTPS ZIP URL containing candidate release assets from the platform build.
        type: string
        default: ''
      platform-package-sha256:
        description: SHA256 of the candidate ZIP supplied by the platform build.
        type: string
        default: ''
      platform-version:
        description: Expected candidate version supplied by the platform build.
        type: string
        default: ''
      deploy:
        description: Explicitly enable deployment to the configured site environment
        type: boolean
        default: false
      deployment-environment:
        description: Azure Static Web Apps named environment; empty only for production
        type: string
        default: ''
    secrets:
      static-web-app-token:
        required: false
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: pwsh
env:
  SITE_SOURCE: ${{ inputs.source-path }}
  SITE_TARGET: ${{ inputs.target }}
  SITE_BASE_URL: ${{ inputs.site-url }}
  PLATFORM_RING: ${{ inputs.platform-ring }}
  PLATFORM_RELEASE: ${{ inputs.platform-release }}
  PLATFORM_PACKAGE_URL: ${{ inputs.platform-package-url }}
  PLATFORM_PACKAGE_SHA256: ${{ inputs.platform-package-sha256 }}
  PLATFORM_VERSION: ${{ inputs.platform-version }}
jobs:
  prepare:
    name: Prepare
    outputs:
      platform-source: ${{ steps.platform.outputs.source-commit }}
      platform-release: ${{ steps.platform.outputs.release-tag }}
      target: ${{ steps.delivery.outputs.target }}
      url: ${{ steps.delivery.outputs.url }}
      environment: ${{ steps.delivery.outputs.environment }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Get platform installer
        uses: actions/checkout@v7
        with:
          repository: nkdAgility/OpenGuidePlatform
          ref: ${{ github.repository == 'nkdAgility/OpenGuidePlatform' && inputs.platform-package-url != '' && github.sha || 'main' }}
          path: .processing/platform-installer
          sparse-checkout: |
            .build/Restore-OpenGuidePlatform.ps1
            system/OpenGuidePlatform.PowerShell.GuideSiteAdoption/Resolve-OpenGuidePlatform.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ vars.HUGO_BUILD_VERSION || 'latest' }}
          extended: true
      - uses: actions/setup-go@v7
        with:
          # Prepare and Build verify executable identities; runner caches must not select different patches.
          go-version: '1.26.10'
          cache: false
      - name: Restore and verify OpenGuidePlatform
        id: platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.processing/platform-installer/.build/Restore-OpenGuidePlatform.ps1 -FromWorkflow -OutputPath .processing/platform
      - name: Install guide-site preparation dependencies
        run: ./.processing/platform/build.ps1 -Product GuideSite -Stage Dependencies -WorkspaceRoot $PWD -SourcePath $env:SITE_SOURCE
      - name: Determine delivery context
        id: delivery
        env:
          SITE_PULL_REQUEST: ${{ github.event.pull_request.number || 0 }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment-environment }}
        run: ./.processing/platform/system/OpenGuidePlatform.PowerShell.GuideSiteBuild/GitHubActions/Invoke-GuideSiteGitHubAction.ps1 -Operation ResolveDelivery
      - name: Prepare guide site
        env:
          SITE_TARGET: ${{ steps.delivery.outputs.target }}
          SITE_BASE_URL: ${{ steps.delivery.outputs.url }}
        run: ./.processing/platform/build.ps1 -Product GuideSite -Stage Prepare -DeliveryContextPath .processing/delivery-context.json -BaseUrl $env:SITE_BASE_URL -WorkspaceRoot $PWD -SourcePath $env:SITE_SOURCE -Target $env:SITE_TARGET -OutputPath .processing/guide-site
      - name: Retain Prepare report for PR delivery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GuideSite-Assessment
          path: |
            .processing/guide-site/prepare/assessment.json
            .processing/guide-site/prepare/assessment.md
          if-no-files-found: error
      - name: Retain prepared context and assessment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GuideSite-Prepare
          include-hidden-files: true
          path: |
            .processing/platform/
            .processing/guide-site/
            .processing/i18n-probe/
          if-no-files-found: error
  prepare-report:
    name: Prepare report
    needs: prepare
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pull-requests: write
    env:
      PLATFORM_RELEASE: ${{ needs.prepare.outputs.platform-release }}
      SITE_TARGET: ${{ needs.prepare.outputs.target }}
      SITE_BASE_URL: ${{ needs.prepare.outputs.url }}
    steps:
      # Restore platform code separately; the site supplies assessment data only.
      - name: Get platform installer
        uses: actions/checkout@v7
        with:
          repository: nkdAgility/OpenGuidePlatform
          ref: ${{ needs.prepare.outputs.platform-source }}
          path: .processing/platform-installer
          sparse-checkout: |
            .build/Restore-OpenGuidePlatform.ps1
            system/OpenGuidePlatform.PowerShell.GuideSiteAdoption/Resolve-OpenGuidePlatform.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Restore and verify OpenGuidePlatform
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.processing/platform-installer/.build/Restore-OpenGuidePlatform.ps1 -FromWorkflow -OutputPath .processing/platform
      - uses: actions/download-artifact@v8
        with:
          name: GuideSite-Assessment
          path: assessment
      - name: Deliver commit-scoped Prepare assessment
        env:
          GH_TOKEN: ${{ github.token }}
          ASSESSED_COMMIT: ${{ inputs.source-ref }}
          ASSESSED_TARGET: ${{ needs.prepare.outputs.target }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: ./.processing/platform/system/OpenGuidePlatform.PowerShell.GuideSiteBuild/GitHubActions/Invoke-GuideSiteGitHubAction.ps1 -Operation PublishPrepare

  build:
    name: Build
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      PLATFORM_RELEASE: ${{ needs.prepare.outputs.platform-release }}
      SITE_TARGET: ${{ needs.prepare.outputs.target }}
      SITE_BASE_URL: ${{ needs.prepare.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore prepared platform and site context
        uses: actions/download-artifact@v8
        with:
          name: GuideSite-Prepare
          path: .processing
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ vars.HUGO_BUILD_VERSION || 'latest' }}
          extended: true
      - uses: actions/setup-go@v7
        with:
          # Prepare and Build verify executable identities; runner caches must not select different patches.
          go-version: '1.26.10'
          cache: false
      - name: Build guide site
        run: ./.processing/platform/build.ps1 -Product GuideSite -Stage Build -WorkspaceRoot $PWD -SourcePath $env:SITE_SOURCE -Target $env:SITE_TARGET -OutputPath .processing/guide-site
      - name: Retain built artifact and identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GuideSite-Build
          include-hidden-files: true
          path: .processing/guide-site/
          if-no-files-found: error
  validate:
    name: Validate
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      PLATFORM_RELEASE: ${{ needs.prepare.outputs.platform-release }}
      SITE_TARGET: ${{ needs.prepare.outputs.target }}
      SITE_BASE_URL: ${{ needs.prepare.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore prepared platform and site context
        uses: actions/download-artifact@v8
        with:
          name: GuideSite-Prepare
          path: .processing
      - name: Download built guide site
        uses: actions/download-artifact@v8
        with:
          name: GuideSite-Build
          path: .processing/guide-site
      - name: Validate guide site
        run: ./.processing/platform/build.ps1 -Product GuideSite -Stage Validate -WorkspaceRoot $PWD -SourcePath $env:SITE_SOURCE -Target $env:SITE_TARGET -OutputPath .processing/guide-site
      - name: Check deployment inputs without deployment credentials
        if: ${{ inputs.deploy }}
        env:
          EXPECTED_COMMIT: ${{ inputs.source-ref }}
          EXPECTED_TARGET: ${{ needs.prepare.outputs.target }}
          DEPLOYMENT_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          DEPLOYMENT_ROOT: .processing/guide-site
        run: ./.processing/platform/system/OpenGuidePlatform.PowerShell.GuideSiteBuild/GitHubActions/Invoke-GuideSiteGitHubAction.ps1 -Operation ConfirmDeployment
      - name: Retain validated deployment files
        if: ${{ inputs.deploy }}
        uses: actions/upload-artifact@v7
        with:
          name: GuideSite-Deployment
          include-hidden-files: true
          path: |
            .processing/guide-site/site/
            .processing/guide-site/artifact-identity.json
            .processing/guide-site/artifact-validation.json
          if-no-files-found: error
      - name: Retain artifact validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GuideSite-Validate
          path: |
            .processing/guide-site/artifact-validation.json
            .processing/guide-site/download-requirements.json
            .processing/guide-site/runtime-anchor-validation.json
            .processing/guide-site/runtime/
          if-no-files-found: error
  deploy:
    name: Deploy
    permissions:
      actions: read
      contents: read
      pull-requests: write
    needs: [prepare, validate]
    if: ${{ inputs.deploy && github.event_name != 'merge_group' }}
    runs-on: ubuntu-24.04
    outputs:
      url: ${{ steps.hosting.outputs.url }}
    env:
      PLATFORM_RELEASE: ${{ needs.prepare.outputs.platform-release }}
      SITE_TARGET: ${{ needs.prepare.outputs.target }}
      SITE_BASE_URL: ${{ needs.prepare.outputs.url }}
    steps:
      # Restore platform code separately; never execute code from the site artifact.
      - name: Get platform installer
        uses: actions/checkout@v7
        with:
          repository: nkdAgility/OpenGuidePlatform
          ref: ${{ needs.prepare.outputs.platform-source }}
          path: .processing/platform-installer
          sparse-checkout: |
            .build/Restore-OpenGuidePlatform.ps1
            system/OpenGuidePlatform.PowerShell.GuideSiteAdoption/Resolve-OpenGuidePlatform.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Restore and verify OpenGuidePlatform
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.processing/platform-installer/.build/Restore-OpenGuidePlatform.ps1 -FromWorkflow -OutputPath .processing/platform
      - uses: actions/download-artifact@v8
        with:
          name: GuideSite-Deployment
          path: deployment
      - name: Verify deployment data before exposing hosting credentials
        env:
          EXPECTED_COMMIT: ${{ inputs.source-ref }}
          EXPECTED_TARGET: ${{ needs.prepare.outputs.target }}
          DEPLOYMENT_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
        run: ./.processing/platform/system/OpenGuidePlatform.PowerShell.GuideSiteBuild/GitHubActions/Invoke-GuideSiteGitHubAction.ps1 -Operation ConfirmDeployment
      - name: Install deployment dependencies
        run: ./.processing/platform/system/OpenGuidePlatform.PowerShell.GuideSiteBuild/GitHubActions/Invoke-GuideSiteGitHubAction.ps1 -Operation InstallDeploymentDependencies
      - name: Deploy validated site
        id: hosting
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.static-web-app-token }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.source-ref }}
          EXPECTED_TARGET: ${{ needs.prepare.outputs.target }}
          DEPLOYMENT_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
        run: ./.processing/platform/system/OpenGuidePlatform.PowerShell.GuideSiteBuild/GitHubActions/Invoke-GuideSiteGitHubAction.ps1 -Operation Deploy
      - name: Retain deployment result and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GuideSite-Hosting
          path: |
            deployment/deployment.json
            .processing/deployment-client/**/deploy.log
          if-no-files-found: warn
  verify:
    name: Verify
    needs: [prepare, deploy]
    if: ${{ inputs.deploy && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      PLATFORM_RELEASE: ${{ needs.prepare.outputs.platform-release }}
      SITE_TARGET: ${{ needs.prepare.outputs.target }}
      SITE_BASE_URL: ${{ needs.prepare.outputs.url }}
      SITE_DEPLOYMENT_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore prepared platform and site context
        uses: actions/download-artifact@v8
        with:
          name: GuideSite-Prepare
          path: .processing
      - name: Download built guide site
        uses: actions/download-artifact@v8
        with:
          name: GuideSite-Build
          path: .processing/guide-site
      - name: Download validation evidence
        uses: actions/download-artifact@v8
        with:
          name: GuideSite-Validate
          path: .processing/guide-site
      - name: Verify guide site
        run: ./.processing/platform/build.ps1 -Product GuideSite -Stage Verify -WorkspaceRoot $PWD -SourcePath $env:SITE_SOURCE -Target $env:SITE_TARGET -OutputPath .processing/guide-site -DeploymentUrl $env:SITE_DEPLOYMENT_URL
      - name: Retain deployed-site verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GuideSite-Verify
          path: .processing/guide-site/deployment-verification.json
          if-no-files-found: error
