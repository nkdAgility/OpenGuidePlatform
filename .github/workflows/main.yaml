# This workflow is managed by gh actions-lock.

name: Pipeline
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: open-guide-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  build:
    permissions:
      contents: read
      actions: read
    name: Build 
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      source-commit: ${{ steps.gitversion.outputs.sha }}
      artifact-id: ${{ steps.assets.outputs.artifact-id }}
      package-url: ${{ format('https://api.github.com/repos/{0}/actions/artifacts/{1}/zip', github.repository, steps.assets.outputs.artifact-id) }}
      package-sha256: ${{ steps.assets.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ vars.HUGO_BUILD_VERSION || 'latest' }}
          extended: true
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.24.5'
          cache: false
      - name: Install build dependencies
        run: ./.build/Install-PlatformTestDependencies.ps1
      - name: Calculate release version
        id: gitversion
        run: ./.build/Get-PlatformVersion.ps1
      - name: Build, package and verify distribution
        env:
          PLATFORM_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: ./build.ps1 -Version $env:PLATFORM_VERSION -OutputPath .processing/platform-package
      - name: Retain candidate release assets
        id: assets
        uses: actions/upload-artifact@v7
        with:
          name: OpenGuidePlatform-ReleaseAssets
          path: |
            .processing/platform-package/OpenGuidePlatform-GuideSite.zip
            .processing/platform-package/release-manifest.json
            .processing/platform-package/OpenGuidePlatform-PlatformBuild.zip
          if-no-files-found: error
  sample:
    name: Validate
    needs: build
    uses: ./.github/workflows/guide-site-build.yaml
    with:
      source-ref: ${{ needs.build.outputs.source-commit }}
      source-path: examples/reference-guide-site
      deploy: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      platform-version: ${{ needs.build.outputs.version }}
      platform-package-url: ${{ needs.build.outputs.package-url }}
      platform-package-sha256: ${{ needs.build.outputs.package-sha256 }}
    secrets:
      static-web-app-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_FIELD_06CEA8C03 }}
  release:
    name: Release
    needs: [build, sample]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: .processing/platform-release
      - name: Restore packaged release tools
        run: Expand-Archive .processing/platform-release/OpenGuidePlatform-PlatformBuild.zip .processing/platform-release/tools
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_VERSION: ${{ needs.build.outputs.version }}
          PLATFORM_COMMIT: ${{ needs.build.outputs.source-commit }}
        run: ./.processing/platform-release/tools/release.ps1 -Stage Release -AssetsPath .processing/platform-release -SourceCommit $env:PLATFORM_COMMIT
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_VERSION: ${{ needs.build.outputs.version }}
          PLATFORM_COMMIT: ${{ needs.build.outputs.source-commit }}
        run: ./.processing/platform-release/tools/release.ps1 -Stage Validate -AssetsPath .processing/platform-release -SourceCommit $env:PLATFORM_COMMIT -ReleaseTag "v$env:PLATFORM_VERSION"
