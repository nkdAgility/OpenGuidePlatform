# This workflow is managed by gh actions-lock.

name: Close PR
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: open-guide-platform-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  close:
    name: Close PR preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/guide-site-close-pr.yaml
    secrets:
      static-web-app-token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_FIELD_06CEA8C03 }}
