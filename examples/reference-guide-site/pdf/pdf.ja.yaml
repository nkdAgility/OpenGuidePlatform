# Japanese needs CJK fonts; CJKmainfont also enables Japanese line breaking.
mainfont: Noto Serif JP
sansfont: Noto Sans JP
monofont: Noto Sans JP
CJKmainfont: Noto Serif JP
fontSources:
  Noto Serif JP: https://github.com/notofonts/noto-cjk/releases/tag/Serif2.003
  Noto Sans JP: https://github.com/notofonts/noto-cjk/releases/tag/Sans2.004
