<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 774" role="img" aria-labelledby="title description">
<title id="title">The translation journey</title>
<desc id="description">Agree the work: People, preferred terms and selected guides. Then Find what already exists: Agent uses guide.transstatus. Then Add the site language: Website words first; keep off the live site. Then Translate the selected guides: People review the proposed words. Then Check and submit for review: Wording, appearance, credits and checks. Then Decide publication separately: Language reviewer and maintainer decide.</desc>
<rect width="480" height="774" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs>
<text x="240" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#0f172a">The translation journey</text>
<rect x="16" y="60" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">1. Agree the work</text>
<text x="240" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">People, preferred terms and selected guides</text>
<path d="M240 147 V168" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="174" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">2. Find what already exists</text>
<text x="240" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Agent uses guide.transstatus</text>
<path d="M240 261 V282" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="288" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">3. Add the site language</text>
<text x="240" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Website words first; keep off the live site</text>
<path d="M240 375 V396" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="402" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">4. Translate the selected guides</text>
<text x="240" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">People review the proposed words</text>
<path d="M240 489 V510" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="516" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">5. Check and submit for review</text>
<text x="240" y="573" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Wording, appearance, credits and checks</text>
<path d="M240 603 V624" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="630" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="659" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">6. Decide publication separately</text>
<text x="240" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Language reviewer and maintainer decide</text>
</svg>
