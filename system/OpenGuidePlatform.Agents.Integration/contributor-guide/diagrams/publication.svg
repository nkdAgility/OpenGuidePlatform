<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660" role="img" aria-labelledby="title description">
<title id="title">From review to readers</title>
<desc id="description">Check the prepared work: Check the words and website; do not publish. Then Submit and review the site: Technical and design review before preview. Then Review the language in preview: Read the result and submit corrections. Then Agree publication separately: Language reviewer and maintainer decide. Then Publish the approved work: Maintainer checks the live website.</desc>
<rect width="480" height="660" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs>
<text x="240" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#0f172a">From review to readers</text>
<rect x="16" y="60" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">1. Check the prepared work</text>
<text x="240" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Check the words and website; do not publish</text>
<path d="M240 147 V168" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="174" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">2. Submit and review the site</text>
<text x="240" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Technical and design review before preview</text>
<path d="M240 261 V282" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="288" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">3. Review the language in preview</text>
<text x="240" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Read the result and submit corrections</text>
<path d="M240 375 V396" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="402" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">4. Agree publication separately</text>
<text x="240" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Language reviewer and maintainer decide</text>
<path d="M240 489 V510" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="516" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">5. Publish the approved work</text>
<text x="240" y="573" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Maintainer checks the live website</text>
</svg>
