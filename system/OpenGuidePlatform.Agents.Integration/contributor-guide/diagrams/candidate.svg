<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660" role="img" aria-labelledby="title description">
<title id="title">Review before replacing a file</title>
<desc id="description">Read source and target: Keep the reviewed fingerprints. Then Prepare a candidate: Propose changes in a separate file. Then Review and check: People assess meaning; tools check constraints. Then Preview and apply: Use WhatIf and original reviewed hashes. Then Inspect and build: A changed hash means reread and reconcile.</desc>
<rect width="480" height="660" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker></defs>
<text x="240" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#0f172a">Review before replacing a file</text>
<rect x="16" y="60" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">1. Read source and target</text>
<text x="240" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Keep the reviewed fingerprints</text>
<path d="M240 147 V168" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="174" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">2. Prepare a candidate</text>
<text x="240" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Propose changes in a separate file</text>
<path d="M240 261 V282" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="288" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">3. Review and check</text>
<text x="240" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">People assess meaning; tools check constraints</text>
<path d="M240 375 V396" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="402" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="431" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">4. Preview and apply</text>
<text x="240" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">Use WhatIf and original reviewed hashes</text>
<path d="M240 489 V510" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="516" width="448" height="84" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
<text x="240" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">5. Inspect and build</text>
<text x="240" y="573" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e293b">A changed hash means reread and reconcile</text>
</svg>
