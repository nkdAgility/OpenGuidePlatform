{{- $baseURL := .Site.BaseURL -}}
{{- $siteURL := .Site.Params.siteProdUrl | default $baseURL -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ .Site.Title }}",
  "alternateName": "{{ .Site.Params.productionSiteUrl | default "https://hugoguides.org"}}",
  "description": "{{ .Site.Params.description }}",
  "url": {{ $siteURL }},
  "publisher": {
    "@type": "Organization",
    "name": "{{ .Site.Title }}",
    "url": {{ $siteURL }}
    {{ with .Site.Params.logo_image }},
    "logo": {
      "@type": "ImageObject",
      "url": {{ . | absURL }}
    }
    {{ end }}
  },
  "sameAs": [
    {{ .Site.Params.githubUrl }}
  ]
}
</script>
